<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 12px; fill: #64748b; }
      .stage { font-size: 13px; font-weight: 700; }
      .row { font-size: 10.5px; fill: #1e293b; }
      .rowd { font-size: 9px; fill: #64748b; }
      .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .mono { font-family: ui-monospace, Menlo, monospace; font-size: 9px; fill: #334155; }
    </style>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 z" fill="#3b6fed"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f8fafc"/>
  <text x="32" y="40" class="title">Phase 3 — Studio-managed data lifecycle</text>
  <text x="32" y="60" class="sub">Judgment data is captured in one module, persisted once, and cross-fed to others — the same store that makes the app feel like one platform.</text>

  <!-- Stage headers -->
  <g class="stage">
    <circle cx="52" cy="92" r="11" fill="#3b6fed"/><text x="52" y="96" text-anchor="middle" class="num">1</text><text x="70" y="96" fill="#0f172a">Capture</text>
    <circle cx="312" cy="92" r="11" fill="#3b6fed"/><text x="312" y="96" text-anchor="middle" class="num">2</text><text x="330" y="96" fill="#0f172a">Persist (once)</text>
    <circle cx="560" cy="92" r="11" fill="#3b6fed"/><text x="560" y="96" text-anchor="middle" class="num">3</text><text x="578" y="96" fill="#0f172a">Consume + cross-feed</text>
  </g>

  <!-- Stage 1: capture -->
  <g>
    <rect x="32" y="112" width="228" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="46" y="136" class="row">Register a product</text><text x="46" y="150" class="rowd">→ metadata (funding, owner, lifecycle)</text>
    <text x="46" y="176" class="row">Opportunity Assessment</text><text x="46" y="190" class="mono">→ assessment</text>
    <text x="46" y="214" class="row">Portfolio Governance</text><text x="46" y="228" class="mono">→ risk</text>
    <text x="46" y="252" class="row">Responsible AI Center</text><text x="46" y="266" class="mono">→ policy · review · model_card</text>
    <text x="46" y="290" class="row">ROI Simulator / Cost Analyzer</text><text x="46" y="304" class="mono">→ roi_scenario · cost_input</text>
    <text x="46" y="328" class="row">Maturity Assessment</text><text x="46" y="342" class="mono">→ maturity_score</text>
    <text x="46" y="366" class="row">Human Approval Center</text><text x="46" y="380" class="mono">→ workflow stage + audit</text>
  </g>

  <!-- Stage 2: persist -->
  <g>
    <rect x="284" y="150" width="196" height="224" rx="10" fill="#0f172a"/>
    <text x="382" y="180" text-anchor="middle" class="stage" fill="#ffffff" font-size="12">Persistence client</text>
    <rect x="300" y="196" width="164" height="52" rx="8" fill="#2b57d4"/>
    <text x="382" y="217" text-anchor="middle" class="row" fill="#ffffff">Cloudflare Worker</text>
    <text x="382" y="233" text-anchor="middle" class="rowd" fill="#c7d7fb">+ Neon (shared)</text>
    <text x="382" y="268" text-anchor="middle" class="rowd" fill="#94a3b8">— or —</text>
    <rect x="300" y="280" width="164" height="46" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="382" y="301" text-anchor="middle" class="row" fill="#e2e8f0">localStorage</text>
    <text x="382" y="316" text-anchor="middle" class="rowd" fill="#94a3b8">$0, no accounts</text>
    <text x="382" y="352" text-anchor="middle" class="mono" fill="#cbd5e1">studio_entities · registrations</text>
  </g>

  <!-- Stage 3: consume + cross-feed -->
  <g>
    <rect x="504" y="112" width="364" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="518" y="140" class="row">Investment Prioritization</text><text x="518" y="154" class="rowd">← assessments (RICE/WSJF, no re-entry)</text>
    <text x="518" y="180" class="row">Risk heatmap (Portfolio Gov.)</text><text x="518" y="194" class="rowd">← risks (likelihood × impact)</text>
    <text x="518" y="220" class="row">Review queues (Responsible AI)</text><text x="518" y="234" class="rowd">← reviews (bias / privacy / security)</text>
    <text x="518" y="260" class="row">Evaluation Dashboard</text><text x="518" y="274" class="rowd">← live snapshot eval metrics (Phase 2)</text>
    <text x="518" y="300" class="row">Scenario / cost comparisons</text><text x="518" y="314" class="rowd">← roi_scenario · cost_input</text>
    <text x="518" y="340" class="row">Maturity radar + roadmap</text><text x="518" y="354" class="rowd">← maturity_score (+ seed from Diagnostic)</text>

    <!-- roll up -->
    <rect x="518" y="366" width="336" height="34" rx="8" fill="#eef4ff" stroke="#c7d7fb"/>
    <text x="530" y="387" class="row" fill="#2244a8">Executive Dashboard — rolls all of the above up <tspan fill="#16a34a">(R13 ✓)</tspan></text>
  </g>

  <!-- arrows -->
  <g stroke="#3b6fed" stroke-width="1.5" fill="none">
    <path d="M260 260 L282 260" marker-end="url(#b)"/>
  </g>
  <g stroke="#16a34a" stroke-width="1.5" fill="none">
    <path d="M480 260 L502 260" marker-end="url(#g)"/>
  </g>

  <text x="32" y="440" class="sub">Same interface either way: writes go to the shared Neon backend when <tspan class="mono">VITE_PERSISTENCE_API</tspan> is set, else localStorage — no code change.</text>
  <text x="32" y="460" class="sub">Everything shown is real (registration + user-entered) or live (Phase-2 snapshots). Nothing is seeded; missing inputs show an honest empty state.</text>
</svg>
